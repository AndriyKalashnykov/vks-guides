<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 879" width="1200" height="879" font-family="'Segoe UI', Arial, sans-serif" role="img" aria-labelledby="t d"><title id="t">A personal certificate: the cluster administrator has the cluster sign a certificate for a new name and gives that name edit in one namespace inside the VKS cluster, for one person with no SSO or identity provider account, for a limited time. Taking it away deletes the name's RoleBinding (with "*": its ClusterRoleBinding) so the name has no rights, but the certificate cannot be withdrawn and keeps proving the name until its end date, so that name is never given rights again.</title><desc id="d">A personal certificate: the cluster administrator has the cluster sign a certificate for a new name and gives that name edit in one namespace inside the VKS cluster, for one person with no SSO or identity provider account, for a limited time. Taking it away deletes the name's RoleBinding (with "*": its ClusterRoleBinding) so the name has no rights, but the certificate cannot be withdrawn and keeps proving the name until its end date, so that name is never given rights again.</desc><rect x="0" y="0" width="1200" height="879" fill="#0D1117"/><rect x="6" y="6" width="1188" height="867" rx="14" fill="none" stroke="#30363D"/><circle cx="66" cy="58" r="26" fill="#94A3B8"/>
<g data-role="icon" data-fg="#0D1117" data-bg="#94A3B8" transform="translate(66.0,58.0) scale(1.692)" fill="none" stroke="#0D1117" stroke-width="1.30" stroke-linecap="round" stroke-linejoin="round"><rect x="-10" y="-7" width="20" height="14" rx="2"/><circle cx="-4" cy="-1" r="2.5"/><path d="M-8,4.5 C-8,2 0,2 0,4.5 M3,-2 H7 M3,2 H7"/></g>
<text font-size="26" fill="#E2E8F0" data-bg="#0D1117" font-weight="700"><tspan x="106.0" y="54.0" data-nl="">A personal certificate</tspan></text>
<text font-size="15" fill="#A8B4C4" data-bg="#0D1117"><tspan x="106.0" y="80.0" data-nl="">For one person with no SSO or identity provider account, for a limited time. Whoever has a copy acts as that person, with kubectl alone. It</tspan><tspan x="106.0" y="100.0" data-nl="">cannot be withdrawn before it ends: taking it away removes the rights of its name.</tspan></text>
<text font-size="16" fill="#E2E8F0" data-bg="#0D1117" font-weight="700"><tspan x="40.0" y="142.0" data-nl="">Where the access lives</tspan></text>
<rect x="40.0" y="154.0" width="590.0" height="234.0" rx="10" fill="#1B222C" stroke="#94A3B8" stroke-width="1.3"/><text font-size="14" fill="#E2E8F0" data-bg="#1B222C" font-weight="700"><tspan x="52.0" y="176.0" data-nl="">vCenter and the vSphere Namespace</tspan></text><text font-size="13" fill="#E2E8F0" data-bg="#1B222C"><tspan x="52.0" y="195.0" data-nl="">No step for the vCenter administrator: the person has no SSO account, and every</tspan><tspan x="52.0" y="212.0" data-nl="">step is the cluster administrator's.</tspan></text><rect x="52.0" y="224.0" width="566.0" height="152.0" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1.3"/><text font-size="14" fill="#E2E8F0" data-bg="#161B22" font-weight="700"><tspan x="64.0" y="246.0" data-nl="">VKS cluster</tspan></text><circle cx="74.0" cy="260.4" r="8.0" fill="#CBD5E1"/><text font-size="13" fill="#E2E8F0" data-bg="#161B22"><tspan x="69.0" y="265.0" data-nl="" font-size="13" font-weight="700" fill="#0D1117" data-bg="#CBD5E1">C</tspan><tspan x="84.0" y="265.0"> asks the cluster to sign a certificate for a new name, PERSON plus the date</tspan><tspan x="64.0" y="282.0" data-nl="">and time, valid for DAYS days, and approves the request.</tspan></text><rect x="64.0" y="294.0" width="542.0" height="70.0" rx="10" fill="#0D2724" stroke="#2DD4BF" stroke-width="1.3"/><text font-size="14" fill="#E2E8F0" data-bg="#0D2724" font-weight="700"><tspan x="76.0" y="316.0" data-nl="">VKS_CLUSTER_NAMESPACE</tspan></text><text font-size="13" fill="#E2E8F0" data-bg="#0D2724"><tspan x="76.0" y="335.0" data-nl="">The person's namespace, a folder for workloads. A RoleBinding gives that</tspan><tspan x="76.0" y="352.0" data-nl="">name edit in it.</tspan></text>
<text font-size="14" fill="#E2E8F0" data-bg="#0D1117" font-weight="700"><tspan x="40.0" y="416.0" data-nl="">What VKS_CLUSTER_NAMESPACE may be</tspan></text>
<rect x="40" y="426.0" width="590" height="36" rx="9" fill="#132338" stroke="#60A5FA" stroke-width="1.1"/>
<circle cx="62" cy="444.0" r="13" fill="#60A5FA"/>
<g data-role="icon" data-fg="#0D1117" data-bg="#60A5FA" transform="translate(62.0,444.0) scale(0.846)" fill="none" stroke="#0D1117" stroke-width="2.36" stroke-linecap="round" stroke-linejoin="round"><path d="M-9,-6 H-3 L-1,-4 H9 V7 H-9 Z"/><path d="M-9,-1 H9"/></g>
<text font-size="13" fill="#E2E8F0" data-bg="#132338"><tspan x="86.0" y="448.5" data-nl="">Their namespace: the name gets edit in it</tspan></text>
<rect x="40" y="468.0" width="590" height="48" rx="9" fill="#2A1F0E" stroke="#F59E0B" stroke-width="1.1"/>
<circle cx="62" cy="492.0" r="13" fill="#F59E0B"/>
<g data-role="icon" data-fg="#0D1117" data-bg="#F59E0B" transform="translate(62.0,492.0) scale(0.846)" fill="none" stroke="#0D1117" stroke-width="2.36" stroke-linecap="round" stroke-linejoin="round"><path d="M-3,-10 L4,-6 V2 L-3,6 L-10,2 V-6 Z M-3,-2 L4,-6 M-3,-2 L-10,-6 M-3,-2 V6"/><path d="M6,1 L11.5,10.5 H0.5 Z M6,4.5 V7"/><circle cx="6" cy="8.8" r="0.4"/></g>
<text font-size="13" fill="#E2E8F0" data-bg="#2A1F0E"><tspan x="86.0" y="488.0" data-nl="">"*": cluster-admin on the whole cluster instead (a ClusterRoleBinding), and the</tspan><tspan x="86.0" y="505.0" data-nl="">block prints a WARNING; only for a person who must administer the cluster</tspan></text>
<rect x="40" y="522.0" width="590" height="36" rx="9" fill="#2D1416" stroke="#F87171" stroke-width="1.1"/>
<circle cx="62" cy="540.0" r="13" fill="#F87171"/>
<g data-role="icon" data-fg="#0D1117" data-bg="#F87171" transform="translate(62.0,540.0) scale(0.846)" fill="none" stroke="#0D1117" stroke-width="2.36" stroke-linecap="round" stroke-linejoin="round"><path d="M-4,-9.5 H4 L9.5,-4 V4 L4,9.5 H-4 L-9.5,4 V-4 Z"/><path d="M-5,0 H5"/></g>
<text font-size="13" fill="#E2E8F0" data-bg="#2D1416"><tspan x="86.0" y="544.5" data-nl="">Empty: the block stops before it changes anything</tspan></text>
<text font-size="16" fill="#E2E8F0" data-bg="#0D1117" font-weight="700"><tspan x="650.0" y="142.0" data-nl="">The steps</tspan></text>
<rect x="650" y="154.0" width="510" height="104" rx="9" fill="#1B222C"/>
<rect x="650" y="159.0" width="5" height="94" rx="2.5" fill="#94A3B8"/>
<circle cx="675" cy="176.0" r="12" fill="#94A3B8"/>
<text font-size="14" fill="#0D1117" data-bg="#94A3B8" font-weight="700"><tspan x="670.1" y="181.0" data-nl="">1</tspan></text>
<text font-size="14" fill="#E2E8F0" data-bg="#1B222C" font-weight="700"><tspan x="694.0" y="178.0" data-nl="">Make the certificate and its file</tspan></text>
<circle cx="704.0" cy="190.4" r="8.0" fill="#CBD5E1"/><text font-size="13" fill="#E2E8F0" data-bg="#1B222C"><tspan x="699.0" y="195.0" data-nl="" font-size="13" font-weight="700" fill="#0D1117" data-bg="#CBD5E1">C</tspan><tspan x="714.0" y="195.0"> sets PERSON, VKS_CLUSTER_NAMESPACE and DAYS</tspan></text>
<text font-size="13" fill="#E2E8F0" data-bg="#1B222C"><tspan x="694.0" y="212.0" data-nl="">DAYS as few as they need. Each run makes a new name; write it</tspan><tspan x="694.0" y="229.0" data-nl="">down: you need it to take the access away. One file,</tspan><tspan x="694.0" y="246.0" data-nl="">PERSON_KUBECONFIG, key included, readable only by you.</tspan></text>
<rect x="650" y="264.0" width="510" height="87" rx="9" fill="#11251A"/>
<rect x="650" y="269.0" width="5" height="77" rx="2.5" fill="#4ADE80"/>
<circle cx="675" cy="286.0" r="12" fill="#4ADE80"/>
<text font-size="14" fill="#0D1117" data-bg="#4ADE80" font-weight="700"><tspan x="670.1" y="291.0" data-nl="">2</tspan></text>
<text font-size="14" fill="#E2E8F0" data-bg="#11251A" font-weight="700"><tspan x="694.0" y="288.0" data-nl="">Hand it over and use it</tspan></text>
<circle cx="704.0" cy="300.4" r="8.0" fill="#CBD5E1"/><text font-size="13" fill="#E2E8F0" data-bg="#11251A"><tspan x="699.0" y="305.0" data-nl="" font-size="13" font-weight="700" fill="#0D1117" data-bg="#CBD5E1">C</tspan><tspan x="714.0" y="305.0">, then the person</tspan></text>
<text font-size="13" fill="#E2E8F0" data-bg="#11251A"><tspan x="694.0" y="322.0" data-nl="">Send the file as a secret: it holds their key. They need only kubectl,</tspan><tspan x="694.0" y="339.0" data-nl="">no password.</tspan></text>
<rect x="650" y="357.0" width="510" height="70" rx="9" fill="#1B222C"/>
<rect x="650" y="362.0" width="5" height="60" rx="2.5" fill="#94A3B8"/>
<circle cx="675" cy="379.0" r="12" fill="#94A3B8"/>
<text font-size="14" fill="#0D1117" data-bg="#94A3B8" font-weight="700"><tspan x="670.1" y="384.0" data-nl="">3</tspan></text>
<text font-size="14" fill="#E2E8F0" data-bg="#1B222C" font-weight="700"><tspan x="694.0" y="381.0" data-nl="">Renew the certificate: it cannot be renewed</tspan></text>
<circle cx="704.0" cy="393.4" r="8.0" fill="#CBD5E1"/><text font-size="13" fill="#E2E8F0" data-bg="#1B222C"><tspan x="699.0" y="398.0" data-nl="" font-size="13" font-weight="700" fill="#0D1117" data-bg="#CBD5E1">C</tspan><tspan x="714.0" y="398.0">, before it ends: step 1 again, a new name</tspan></text>
<text font-size="13" fill="#E2E8F0" data-bg="#1B222C"><tspan x="694.0" y="415.0" data-nl="">Send the new file, and take the old name's rights away with step 4.</tspan></text>
<rect x="650" y="433.0" width="510" height="87" rx="9" fill="#2D1416"/>
<rect x="650" y="438.0" width="5" height="77" rx="2.5" fill="#F87171"/>
<circle cx="675" cy="455.0" r="12" fill="#F87171"/>
<text font-size="14" fill="#0D1117" data-bg="#F87171" font-weight="700"><tspan x="670.1" y="460.0" data-nl="">4</tspan></text>
<text font-size="14" fill="#E2E8F0" data-bg="#2D1416" font-weight="700"><tspan x="694.0" y="457.0" data-nl="">Take the certificate away</tspan></text>
<circle cx="704.0" cy="469.4" r="8.0" fill="#CBD5E1"/><text font-size="13" fill="#E2E8F0" data-bg="#2D1416"><tspan x="699.0" y="474.0" data-nl="" font-size="13" font-weight="700" fill="#0D1117" data-bg="#CBD5E1">C</tspan><tspan x="714.0" y="474.0">, when the person should lose access or has a new certificate</tspan></text>
<text font-size="13" fill="#E2E8F0" data-bg="#2D1416"><tspan x="694.0" y="491.0" data-nl="">Sets NAME, the name from step 1, and the same</tspan><tspan x="694.0" y="508.0" data-nl="">VKS_CLUSTER_NAMESPACE; an empty value stops it.</tspan></text>
<text font-size="16" fill="#E2E8F0" data-bg="#0D1117" font-weight="700"><tspan x="40.0" y="588.0" data-nl="">Step 4 in full: what it deletes, what it checks, what keeps working</tspan></text>
<rect x="40.0" y="600" width="365.3" height="191.0" rx="10" fill="#2D1416" stroke="#F87171" stroke-width="1.2"/>
<text font-size="14" fill="#E2E8F0" data-bg="#2D1416" font-weight="700"><tspan x="84.0" y="625.0" data-nl="">It deletes</tspan></text>
<circle cx="62.0" cy="620" r="13" fill="#F87171"/>
<g data-role="icon" data-fg="#0D1117" data-bg="#F87171" transform="translate(62.0,620.0) scale(0.846)" fill="none" stroke="#0D1117" stroke-width="2.36" stroke-linecap="round" stroke-linejoin="round"><circle cx="-8" cy="6" r="3"/><circle cx="0" cy="6" r="3"/><path d="M-6,3.5 L1,-9 M-2,3.5 L-9,-9"/><rect x="4.5" y="0" width="8" height="7" rx="1"/><path d="M6.3,0 V-2 A2.2,2.2 0 0 1 10.7,-2 V0"/></g>
<circle cx="57.0" cy="647.5" r="2.6" fill="#F87171"/>
<text font-size="13" fill="#E2E8F0" data-bg="#2D1416"><tspan x="66.0" y="652.0" data-nl="">The RoleBinding of the name from step 1</tspan></text>
<circle cx="57.0" cy="670.5" r="2.6" fill="#F87171"/>
<text font-size="13" fill="#E2E8F0" data-bg="#2D1416"><tspan x="66.0" y="675.0" data-nl="">With "*": its cluster-admin ClusterRoleBinding;</tspan><tspan x="66.0" y="692.0" data-nl="">also a cluster-admin one left by an earlier "*" run</tspan></text>
<circle cx="57.0" cy="710.5" r="2.6" fill="#F87171"/>
<text font-size="13" fill="#E2E8F0" data-bg="#2D1416"><tspan x="66.0" y="715.0" data-nl="">Nothing else changes</tspan></text>
<rect x="417.3" y="600" width="365.3" height="191.0" rx="10" fill="#132338" stroke="#60A5FA" stroke-width="1.2"/>
<text font-size="14" fill="#E2E8F0" data-bg="#132338" font-weight="700"><tspan x="461.3" y="625.0" data-nl="">It checks</tspan></text>
<circle cx="439.3" cy="620" r="13" fill="#60A5FA"/>
<g data-role="icon" data-fg="#0D1117" data-bg="#60A5FA" transform="translate(439.3,620.0) scale(0.846)" fill="none" stroke="#0D1117" stroke-width="2.36" stroke-linecap="round" stroke-linejoin="round"><path d="M-10,0 Q0,-9 10,0 Q0,9 -10,0 Z"/><circle cx="0" cy="0" r="3"/></g>
<circle cx="434.3" cy="647.5" r="2.6" fill="#60A5FA"/>
<text font-size="13" fill="#E2E8F0" data-bg="#132338"><tspan x="443.3" y="652.0" data-nl="">Whether that name may still deploy</tspan></text>
<circle cx="434.3" cy="670.5" r="2.6" fill="#60A5FA"/>
<text font-size="13" fill="#E2E8F0" data-bg="#132338"><tspan x="443.3" y="675.0" data-nl="">With "*": whether it may still do everything, and</tspan><tspan x="443.3" y="692.0" data-nl="">FAILED if a RoleBinding still names it</tspan></text>
<rect x="794.7" y="600" width="365.3" height="191.0" rx="10" fill="#2A1F0E" stroke="#F59E0B" stroke-width="1.2"/>
<text font-size="14" fill="#E2E8F0" data-bg="#2A1F0E" font-weight="700"><tspan x="838.7" y="625.0" data-nl="">What keeps working</tspan></text>
<circle cx="816.7" cy="620" r="13" fill="#F59E0B"/>
<g data-role="icon" data-fg="#0D1117" data-bg="#F59E0B" transform="translate(816.7,620.0) scale(0.846)" fill="none" stroke="#0D1117" stroke-width="2.36" stroke-linecap="round" stroke-linejoin="round"><path d="M-10,-9 H0 M-10,9 H0 M-9,-9 C-9,-2 -1,2 -1,9 M-1,-9 C-1,-2 -9,2 -9,9"/><rect x="3" y="0" width="8" height="7" rx="1"/><path d="M4.8,0 V-2 A2.2,2.2 0 0 1 9.2,-2 V0"/></g>
<circle cx="811.7" cy="647.5" r="2.6" fill="#F59E0B"/>
<text font-size="13" fill="#E2E8F0" data-bg="#2A1F0E"><tspan x="820.7" y="652.0" data-nl="">The certificate keeps proving the name until its</tspan><tspan x="820.7" y="669.0" data-nl="">end date: never give that name rights again</tspan></text>
<circle cx="811.7" cy="687.5" r="2.6" fill="#F59E0B"/>
<text font-size="13" fill="#E2E8F0" data-bg="#2A1F0E"><tspan x="820.7" y="692.0" data-nl="">With edit: tokens they made for any</tspan><tspan x="820.7" y="709.0" data-nl="">ServiceAccount in VKS_CLUSTER_NAMESPACE,</tspan><tspan x="820.7" y="726.0" data-nl="">and workloads they started: delete them</tspan></text>
<circle cx="811.7" cy="744.5" r="2.6" fill="#F59E0B"/>
<text font-size="13" fill="#E2E8F0" data-bg="#2A1F0E"><tspan x="820.7" y="749.0" data-nl="">With "*": logins made with it as a cluster</tspan><tspan x="820.7" y="766.0" data-nl="">administrator</tspan></text>
<path d="M40,813 H1160" stroke="#30363D" stroke-width="1"/>
<circle cx="50.0" cy="830.5" r="8.0" fill="#CBD5E1"/><text font-size="13" fill="#E2E8F0" data-bg="#0D1117"><tspan x="45.0" y="835.0" data-nl="" font-size="13" font-weight="700" fill="#0D1117" data-bg="#CBD5E1">C</tspan><tspan x="60.0" y="835.0"> = cluster administrator: holds the cluster's administrator kubeconfig and does</tspan><tspan x="40.0" y="852.0" data-nl="">every step here</tspan></text>
<text font-size="13" fill="#E2E8F0" data-bg="#0D1117"><tspan x="600.0" y="835.0" data-nl="">The person: uses the file they were sent, with kubectl alone</tspan></text>
</svg>

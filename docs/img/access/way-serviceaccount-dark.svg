<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 996" width="1200" height="996" font-family="'Segoe UI', Arial, sans-serif" role="img" aria-labelledby="t d"><title id="t">A ServiceAccount token: the cluster administrator alone makes a login that belongs to no person, with the ServiceAccount in its own namespace SA_NAMESPACE, where the team has no rights (with "*" it has), and its RoleBinding in the team's namespace VKS_CLUSTER_NAMESPACE; with "*" the login gets the whole cluster, cluster-admin with edit or read-only with view. Taking it away deletes the ServiceAccount, its bindings and, for one namespace, the token Secrets in it, so every copy of the file stops, but tokens and workloads the team made keep working, and with "*" and edit so do logins made with it as a cluster administrator.</title><desc id="d">A ServiceAccount token: the cluster administrator alone makes a login that belongs to no person, with the ServiceAccount in its own namespace SA_NAMESPACE, where the team has no rights (with "*" it has), and its RoleBinding in the team's namespace VKS_CLUSTER_NAMESPACE; with "*" the login gets the whole cluster, cluster-admin with edit or read-only with view. Taking it away deletes the ServiceAccount, its bindings and, for one namespace, the token Secrets in it, so every copy of the file stops, but tokens and workloads the team made keep working, and with "*" and edit so do logins made with it as a cluster administrator.</desc><rect x="0" y="0" width="1200" height="996" fill="#0D1117"/><rect x="6" y="6" width="1188" height="984" rx="14" fill="none" stroke="#30363D"/><circle cx="66" cy="58" r="26" fill="#F59E0B"/>
<g data-role="icon" data-fg="#0D1117" data-bg="#F59E0B" transform="translate(66.0,58.0) scale(1.692)" fill="none" stroke="#0D1117" stroke-width="1.30" stroke-linecap="round" stroke-linejoin="round"><circle cx="0" cy="0" r="4.5"/><path d="M0,-10 V-7 M0,7 V10 M-10,0 H-7 M7,0 H10 M-7,-7 L-5,-5 M5,5 L7,7 M-7,7 L-5,5 M5,-5 L7,-7"/></g>
<text font-size="26" fill="#E2E8F0" data-bg="#0D1117" font-weight="700"><tspan x="106.0" y="54.0" data-nl="">A ServiceAccount token</tspan></text>
<text font-size="15" fill="#A8B4C4" data-bg="#0D1117"><tspan x="106.0" y="80.0" data-nl="">For a CI pipeline, a deployment tool, or a team that shares one login, in one namespace. Whoever has a copy of the file acts as the</tspan><tspan x="106.0" y="100.0" data-nl="">ServiceAccount, not as a person; only deleting the ServiceAccount takes it away.</tspan></text>
<text font-size="16" fill="#E2E8F0" data-bg="#0D1117" font-weight="700"><tspan x="40.0" y="142.0" data-nl="">Where the access lives</tspan></text>
<rect x="40.0" y="154.0" width="590.0" height="285.0" rx="10" fill="#1B222C" stroke="#94A3B8" stroke-width="1.3"/><text font-size="14" fill="#E2E8F0" data-bg="#1B222C" font-weight="700"><tspan x="52.0" y="176.0" data-nl="">vCenter and the vSphere Namespace</tspan></text><text font-size="13" fill="#E2E8F0" data-bg="#1B222C"><tspan x="52.0" y="195.0" data-nl="">No step for the vCenter administrator: every step is the cluster administrator's.</tspan><tspan x="52.0" y="212.0" data-nl="">Removing or disabling an SSO or identity provider user does not take this login away.</tspan></text><rect x="52.0" y="224.0" width="566.0" height="203.0" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1.3"/><text font-size="14" fill="#E2E8F0" data-bg="#161B22" font-weight="700"><tspan x="64.0" y="246.0" data-nl="">VKS cluster</tspan></text><circle cx="74.0" cy="260.4" r="8.0" fill="#CBD5E1"/><text font-size="13" fill="#E2E8F0" data-bg="#161B22"><tspan x="69.0" y="265.0" data-nl="" font-size="13" font-weight="700" fill="#0D1117" data-bg="#CBD5E1">C</tspan><tspan x="84.0" y="265.0"> makes everything here. Two namespaces inside the cluster, folders for</tspan><tspan x="64.0" y="282.0" data-nl="">workloads, not vSphere Namespaces:</tspan></text><rect x="64.0" y="294.0" width="266.0" height="121.0" rx="10" fill="#2A1F0E" stroke="#F59E0B" stroke-width="1.3"/><text font-size="14" fill="#E2E8F0" data-bg="#2A1F0E" font-weight="700"><tspan x="76.0" y="316.0" data-nl="">SA_NAMESPACE</tspan></text><text font-size="13" fill="#E2E8F0" data-bg="#2A1F0E"><tspan x="76.0" y="335.0" data-nl="">The ServiceAccount</tspan><tspan x="76.0" y="352.0" data-nl="">SERVICE_ACCOUNT_NAME lives</tspan><tspan x="76.0" y="369.0" data-nl="">here. The team has no rights here</tspan><tspan x="76.0" y="386.0" data-nl="">(with "*" it has), so it cannot make</tspan><tspan x="76.0" y="403.0" data-nl="">more tokens for it.</tspan></text><rect x="340.0" y="294.0" width="266.0" height="121.0" rx="10" fill="#0D2724" stroke="#2DD4BF" stroke-width="1.3"/><text font-size="14" fill="#E2E8F0" data-bg="#0D2724" font-weight="700"><tspan x="352.0" y="316.0" data-nl="">VKS_CLUSTER_NAMESPACE</tspan></text><text font-size="13" fill="#E2E8F0" data-bg="#0D2724"><tspan x="352.0" y="335.0" data-nl="">The team's namespace. A</tspan><tspan x="352.0" y="352.0" data-nl="">RoleBinding gives the</tspan><tspan x="352.0" y="369.0" data-nl="">ServiceAccount ROLE here: edit to</tspan><tspan x="352.0" y="386.0" data-nl="">deploy, or view to only read.</tspan></text>
<text font-size="14" fill="#E2E8F0" data-bg="#0D1117" font-weight="700"><tspan x="40.0" y="467.0" data-nl="">What VKS_CLUSTER_NAMESPACE may be</tspan></text>
<rect x="40" y="477.0" width="590" height="48" rx="9" fill="#132338" stroke="#60A5FA" stroke-width="1.1"/>
<circle cx="62" cy="501.0" r="13" fill="#60A5FA"/>
<g data-role="icon" data-fg="#0D1117" data-bg="#60A5FA" transform="translate(62.0,501.0) scale(0.846)" fill="none" stroke="#0D1117" stroke-width="2.36" stroke-linecap="round" stroke-linejoin="round"><path d="M-9,-6 H-3 L-1,-4 H9 V7 H-9 Z"/><path d="M-9,-1 H9"/></g>
<text font-size="13" fill="#E2E8F0" data-bg="#132338"><tspan x="86.0" y="497.0" data-nl="">A namespace: what this way is for, a login to one namespace inside the VKS</tspan><tspan x="86.0" y="514.0" data-nl="">cluster</tspan></text>
<rect x="40" y="531.0" width="590" height="48" rx="9" fill="#2A1F0E" stroke="#F59E0B" stroke-width="1.1"/>
<circle cx="62" cy="555.0" r="13" fill="#F59E0B"/>
<g data-role="icon" data-fg="#0D1117" data-bg="#F59E0B" transform="translate(62.0,555.0) scale(0.846)" fill="none" stroke="#0D1117" stroke-width="2.36" stroke-linecap="round" stroke-linejoin="round"><path d="M-3,-10 L4,-6 V2 L-3,6 L-10,2 V-6 Z M-3,-2 L4,-6 M-3,-2 L-10,-6 M-3,-2 V6"/><path d="M6,1 L11.5,10.5 H0.5 Z M6,4.5 V7"/><circle cx="6" cy="8.8" r="0.4"/></g>
<text font-size="13" fill="#E2E8F0" data-bg="#2A1F0E"><tspan x="86.0" y="551.0" data-nl="">"*": the whole cluster instead (a ClusterRoleBinding), and the block prints a</tspan><tspan x="86.0" y="568.0" data-nl="">WARNING: cluster-admin with edit, read-only with view, not Secrets or nodes (1)</tspan></text>
<rect x="40" y="585.0" width="590" height="36" rx="9" fill="#2D1416" stroke="#F87171" stroke-width="1.1"/>
<circle cx="62" cy="603.0" r="13" fill="#F87171"/>
<g data-role="icon" data-fg="#0D1117" data-bg="#F87171" transform="translate(62.0,603.0) scale(0.846)" fill="none" stroke="#0D1117" stroke-width="2.36" stroke-linecap="round" stroke-linejoin="round"><path d="M-4,-9.5 H4 L9.5,-4 V4 L4,9.5 H-4 L-9.5,4 V-4 Z"/><path d="M-5,0 H5"/></g>
<text font-size="13" fill="#E2E8F0" data-bg="#2D1416"><tspan x="86.0" y="607.5" data-nl="">Empty: the block stops before it changes anything</tspan></text>
<text font-size="16" fill="#E2E8F0" data-bg="#0D1117" font-weight="700"><tspan x="650.0" y="142.0" data-nl="">The steps</tspan></text>
<rect x="650" y="154.0" width="510" height="121" rx="9" fill="#1B222C"/>
<rect x="650" y="159.0" width="5" height="111" rx="2.5" fill="#94A3B8"/>
<circle cx="675" cy="176.0" r="12" fill="#94A3B8"/>
<text font-size="14" fill="#0D1117" data-bg="#94A3B8" font-weight="700"><tspan x="670.1" y="181.0" data-nl="">1</tspan></text>
<text font-size="14" fill="#E2E8F0" data-bg="#1B222C" font-weight="700"><tspan x="694.0" y="178.0" data-nl="">Make the token and its file</tspan></text>
<circle cx="704.0" cy="190.4" r="8.0" fill="#CBD5E1"/><text font-size="13" fill="#E2E8F0" data-bg="#1B222C"><tspan x="699.0" y="195.0" data-nl="" font-size="13" font-weight="700" fill="#0D1117" data-bg="#CBD5E1">C</tspan><tspan x="714.0" y="195.0"> sets SERVICE_ACCOUNT_NAME, VKS_CLUSTER_NAMESPACE,</tspan><tspan x="694.0" y="212.0" data-nl="">SA_NAMESPACE, ROLE and DAYS</tspan></text>
<text font-size="13" fill="#E2E8F0" data-bg="#1B222C"><tspan x="694.0" y="229.0" data-nl="">DAYS as short as the work allows; the cluster does not shorten it.</tspan><tspan x="694.0" y="246.0" data-nl="">One file, SERVICE_ACCOUNT_KUBECONFIG, readable only by you;</tspan><tspan x="694.0" y="263.0" data-nl="">it shows when the token ends, which login it is and what it may do.</tspan></text>
<rect x="650" y="281.0" width="510" height="104" rx="9" fill="#11251A"/>
<rect x="650" y="286.0" width="5" height="94" rx="2.5" fill="#4ADE80"/>
<circle cx="675" cy="303.0" r="12" fill="#4ADE80"/>
<text font-size="14" fill="#0D1117" data-bg="#4ADE80" font-weight="700"><tspan x="670.1" y="308.0" data-nl="">2</tspan></text>
<text font-size="14" fill="#E2E8F0" data-bg="#11251A" font-weight="700"><tspan x="694.0" y="305.0" data-nl="">Hand it over and use it</tspan></text>
<circle cx="704.0" cy="317.4" r="8.0" fill="#CBD5E1"/><text font-size="13" fill="#E2E8F0" data-bg="#11251A"><tspan x="699.0" y="322.0" data-nl="" font-size="13" font-weight="700" fill="#0D1117" data-bg="#CBD5E1">C</tspan><tspan x="714.0" y="322.0">, then the team or tool</tspan></text>
<text font-size="13" fill="#E2E8F0" data-bg="#11251A"><tspan x="694.0" y="339.0" data-nl="">Send the file as a secret: whoever has a copy acts as the</tspan><tspan x="694.0" y="356.0" data-nl="">ServiceAccount. It needs only kubectl: no password, SSO account or</tspan><tspan x="694.0" y="373.0" data-nl="">VCF CLI.</tspan></text>
<rect x="650" y="391.0" width="510" height="87" rx="9" fill="#1B222C"/>
<rect x="650" y="396.0" width="5" height="77" rx="2.5" fill="#94A3B8"/>
<circle cx="675" cy="413.0" r="12" fill="#94A3B8"/>
<text font-size="14" fill="#0D1117" data-bg="#94A3B8" font-weight="700"><tspan x="670.1" y="418.0" data-nl="">3</tspan></text>
<text font-size="14" fill="#E2E8F0" data-bg="#1B222C" font-weight="700"><tspan x="694.0" y="415.0" data-nl="">Renew the token</tspan></text>
<circle cx="704.0" cy="427.4" r="8.0" fill="#CBD5E1"/><text font-size="13" fill="#E2E8F0" data-bg="#1B222C"><tspan x="699.0" y="432.0" data-nl="" font-size="13" font-weight="700" fill="#0D1117" data-bg="#CBD5E1">C</tspan><tspan x="714.0" y="432.0"> runs step 1 again before the token ends</tspan></text>
<text font-size="13" fill="#E2E8F0" data-bg="#1B222C"><tspan x="694.0" y="449.0" data-nl="">Send the new file. The old file keeps working until its own end; to</tspan><tspan x="694.0" y="466.0" data-nl="">stop it sooner, take the access away and make a new one.</tspan></text>
<rect x="650" y="484.0" width="510" height="121" rx="9" fill="#2D1416"/>
<rect x="650" y="489.0" width="5" height="111" rx="2.5" fill="#F87171"/>
<circle cx="675" cy="506.0" r="12" fill="#F87171"/>
<text font-size="14" fill="#0D1117" data-bg="#F87171" font-weight="700"><tspan x="670.1" y="511.0" data-nl="">4</tspan></text>
<text font-size="14" fill="#E2E8F0" data-bg="#2D1416" font-weight="700"><tspan x="694.0" y="508.0" data-nl="">Take the token away</tspan></text>
<circle cx="704.0" cy="520.5" r="8.0" fill="#CBD5E1"/><text font-size="13" fill="#E2E8F0" data-bg="#2D1416"><tspan x="699.0" y="525.0" data-nl="" font-size="13" font-weight="700" fill="#0D1117" data-bg="#CBD5E1">C</tspan><tspan x="714.0" y="525.0">, when the team should lose access or a copy may have leaked</tspan></text>
<text font-size="13" fill="#E2E8F0" data-bg="#2D1416"><tspan x="694.0" y="542.0" data-nl="">Sets the same SERVICE_ACCOUNT_NAME,</tspan><tspan x="694.0" y="559.0" data-nl="">VKS_CLUSTER_NAMESPACE and SA_NAMESPACE as step 1; an</tspan><tspan x="694.0" y="576.0" data-nl="">empty VKS_CLUSTER_NAMESPACE stops it before it deletes</tspan><tspan x="694.0" y="593.0" data-nl="">anything.</tspan></text>
<text font-size="16" fill="#E2E8F0" data-bg="#0D1117" font-weight="700"><tspan x="40.0" y="651.0" data-nl="">Step 4 in full: what it deletes, what it checks, what keeps working</tspan></text>
<rect x="40.0" y="663" width="365.3" height="225.0" rx="10" fill="#2D1416" stroke="#F87171" stroke-width="1.2"/>
<text font-size="14" fill="#E2E8F0" data-bg="#2D1416" font-weight="700"><tspan x="84.0" y="688.0" data-nl="">It deletes</tspan></text>
<circle cx="62.0" cy="683" r="13" fill="#F87171"/>
<g data-role="icon" data-fg="#0D1117" data-bg="#F87171" transform="translate(62.0,683.0) scale(0.846)" fill="none" stroke="#0D1117" stroke-width="2.36" stroke-linecap="round" stroke-linejoin="round"><circle cx="-5" cy="6" r="3"/><circle cx="5" cy="6" r="3"/><path d="M-3,3.5 L6,-9 M3,3.5 L-6,-9"/></g>
<circle cx="57.0" cy="710.5" r="2.6" fill="#F87171"/>
<text font-size="13" fill="#E2E8F0" data-bg="#2D1416"><tspan x="66.0" y="715.0" data-nl="">The ServiceAccount, and every ServiceAccount</tspan><tspan x="66.0" y="732.0" data-nl="">token Secret in VKS_CLUSTER_NAMESPACE,</tspan><tspan x="66.0" y="749.0" data-nl="">also those the team did not make</tspan></text>
<circle cx="57.0" cy="767.5" r="2.6" fill="#F87171"/>
<text font-size="13" fill="#E2E8F0" data-bg="#2D1416"><tspan x="66.0" y="772.0" data-nl="">The login's ClusterRoleBindings, cluster-admin</tspan><tspan x="66.0" y="789.0" data-nl="">and view, whichever an earlier "*" run made; with</tspan><tspan x="66.0" y="806.0" data-nl="">"*" the token Secrets are not swept</tspan></text>
<circle cx="57.0" cy="824.5" r="2.6" fill="#F87171"/>
<text font-size="13" fill="#E2E8F0" data-bg="#2D1416"><tspan x="66.0" y="829.0" data-nl="">Its RoleBindings in the namespace, edit and view,</tspan><tspan x="66.0" y="846.0" data-nl="">whatever ROLE step 1 used; not the namespace:</tspan><tspan x="66.0" y="863.0" data-nl="">delete it when the work in it is no longer needed</tspan></text>
<rect x="417.3" y="663" width="365.3" height="225.0" rx="10" fill="#132338" stroke="#60A5FA" stroke-width="1.2"/>
<text font-size="14" fill="#E2E8F0" data-bg="#132338" font-weight="700"><tspan x="461.3" y="688.0" data-nl="">It checks</tspan></text>
<circle cx="439.3" cy="683" r="13" fill="#60A5FA"/>
<g data-role="icon" data-fg="#0D1117" data-bg="#60A5FA" transform="translate(439.3,683.0) scale(0.846)" fill="none" stroke="#0D1117" stroke-width="2.36" stroke-linecap="round" stroke-linejoin="round"><path d="M-10,0 Q0,-9 10,0 Q0,9 -10,0 Z"/><circle cx="0" cy="0" r="3"/></g>
<circle cx="434.3" cy="710.5" r="2.6" fill="#60A5FA"/>
<text font-size="13" fill="#E2E8F0" data-bg="#132338"><tspan x="443.3" y="715.0" data-nl="">Whether that login may still list pods in every</tspan><tspan x="443.3" y="732.0" data-nl="">namespace, and in its namespace</tspan></text>
<circle cx="434.3" cy="750.5" r="2.6" fill="#60A5FA"/>
<text font-size="13" fill="#E2E8F0" data-bg="#132338"><tspan x="443.3" y="755.0" data-nl="">ServiceAccount gone: every copy of the file then</tspan><tspan x="443.3" y="772.0" data-nl="">answers Unauthorized; a new ServiceAccount of</tspan><tspan x="443.3" y="789.0" data-nl="">the same name does not bring the copies back</tspan></text>
<circle cx="434.3" cy="807.5" r="2.6" fill="#60A5FA"/>
<text font-size="13" fill="#E2E8F0" data-bg="#132338"><tspan x="443.3" y="812.0" data-nl="">With "*": FAILED if a RoleBinding still names the</tspan><tspan x="443.3" y="829.0" data-nl="">login</tspan></text>
<rect x="794.7" y="663" width="365.3" height="225.0" rx="10" fill="#2A1F0E" stroke="#F59E0B" stroke-width="1.2"/>
<text font-size="14" fill="#E2E8F0" data-bg="#2A1F0E" font-weight="700"><tspan x="838.7" y="688.0" data-nl="">What keeps working</tspan></text>
<circle cx="816.7" cy="683" r="13" fill="#F59E0B"/>
<g data-role="icon" data-fg="#0D1117" data-bg="#F59E0B" transform="translate(816.7,683.0) scale(0.846)" fill="none" stroke="#0D1117" stroke-width="2.36" stroke-linecap="round" stroke-linejoin="round"><circle cx="-6" cy="6" r="3"/><circle cx="3" cy="6" r="3"/><path d="M-4,3.5 L4,-9 M1,3.5 L-7,-9"/><circle cx="9" cy="-1" r="2" fill="#0D1117" stroke="none"/></g>
<circle cx="811.7" cy="710.5" r="2.6" fill="#F59E0B"/>
<text font-size="13" fill="#E2E8F0" data-bg="#2A1F0E"><tspan x="820.7" y="715.0" data-nl="">Tokens the team made itself, and workloads it</tspan><tspan x="820.7" y="732.0" data-nl="">started: delete the workloads, re-create any</tspan><tspan x="820.7" y="749.0" data-nl="">ServiceAccount in VKS_CLUSTER_NAMESPACE</tspan><tspan x="820.7" y="766.0" data-nl="">that has rights, then restart the workloads that</tspan><tspan x="820.7" y="783.0" data-nl="">use them</tspan></text>
<circle cx="811.7" cy="801.5" r="2.6" fill="#F59E0B"/>
<text font-size="13" fill="#E2E8F0" data-bg="#2A1F0E"><tspan x="820.7" y="806.0" data-nl="">With "*" and edit: logins made with it as a cluster</tspan><tspan x="820.7" y="823.0" data-nl="">administrator</tspan></text>
<circle cx="811.7" cy="841.5" r="2.6" fill="#F59E0B"/>
<text font-size="13" fill="#E2E8F0" data-bg="#2A1F0E"><tspan x="820.7" y="846.0" data-nl="">So never give edit on a namespace that holds</tspan><tspan x="820.7" y="863.0" data-nl="">software with wider rights</tspan></text>
<text font-size="13" fill="#A8B4C4" data-bg="#0D1117"><tspan x="40.0" y="908.0" data-nl="">(1) Use "*" for a whole-cluster login that must end after DAYS; for one that never ends, use the administrator token.</tspan></text>
<path d="M40,930 H1160" stroke="#30363D" stroke-width="1"/>
<circle cx="50.0" cy="947.5" r="8.0" fill="#CBD5E1"/><text font-size="13" fill="#E2E8F0" data-bg="#0D1117"><tspan x="45.0" y="952.0" data-nl="" font-size="13" font-weight="700" fill="#0D1117" data-bg="#CBD5E1">C</tspan><tspan x="60.0" y="952.0"> = cluster administrator: holds the cluster's administrator kubeconfig and does</tspan><tspan x="40.0" y="969.0" data-nl="">every step here</tspan></text>
<text font-size="13" fill="#E2E8F0" data-bg="#0D1117"><tspan x="600.0" y="952.0" data-nl="">Team or tool: uses the file it was sent; whoever holds a copy is that login</tspan></text>
</svg>

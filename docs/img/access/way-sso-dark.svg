<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 945" width="1200" height="945" font-family="'Segoe UI', Arial, sans-serif" role="img" aria-labelledby="t d"><title id="t">The person's own SSO account: the vCenter administrator gives the person's SSO user Can view on the vSphere Namespace, which lets them log in, and the cluster administrator gives that name edit in one namespace inside the VKS cluster; the person logs in with the VCF CLI, which writes their own kubeconfig, so no secret is sent. Taking it away deletes the RoleBinding, which stops it at once, and removes the role in vCenter; if the person still has rights, they have them through a group with Can edit or Owner.</title><desc id="d">The person's own SSO account: the vCenter administrator gives the person's SSO user Can view on the vSphere Namespace, which lets them log in, and the cluster administrator gives that name edit in one namespace inside the VKS cluster; the person logs in with the VCF CLI, which writes their own kubeconfig, so no secret is sent. Taking it away deletes the RoleBinding, which stops it at once, and removes the role in vCenter; if the person still has rights, they have them through a group with Can edit or Owner.</desc><rect x="0" y="0" width="1200" height="945" fill="#0D1117"/><rect x="6" y="6" width="1188" height="933" rx="14" fill="none" stroke="#30363D"/><circle cx="66" cy="58" r="26" fill="#60A5FA"/>
<g data-role="icon" data-fg="#0D1117" data-bg="#60A5FA" transform="translate(66.0,58.0) scale(1.692)" fill="none" stroke="#0D1117" stroke-width="1.30" stroke-linecap="round" stroke-linejoin="round"><circle cx="-3" cy="-4" r="4"/><path d="M-10,9 C-10,2 4,2 4,9"/><rect x="4" y="-9" width="7" height="5" rx="1"/><path d="M6,-6.5 H9"/></g>
<text font-size="26" fill="#E2E8F0" data-bg="#0D1117" font-weight="700"><tspan x="106.0" y="54.0" data-nl="">The person's own SSO account</tspan></text>
<text font-size="15" fill="#A8B4C4" data-bg="#0D1117"><tspan x="106.0" y="80.0" data-nl="">For people who have a vCenter SSO account. They log in as themselves with the VCF CLI, and the login writes their own kubeconfig: you</tspan><tspan x="106.0" y="100.0" data-nl="">send them names and the vCenter CA, not a kubeconfig.</tspan></text>
<text font-size="16" fill="#E2E8F0" data-bg="#0D1117" font-weight="700"><tspan x="40.0" y="142.0" data-nl="">Where the access lives</tspan></text>
<rect x="40.0" y="154.0" width="590.0" height="316.0" rx="10" fill="#1B222C" stroke="#94A3B8" stroke-width="1.3"/><text font-size="14" fill="#E2E8F0" data-bg="#1B222C" font-weight="700"><tspan x="52.0" y="176.0" data-nl="">vCenter</tspan></text><circle cx="62.0" cy="190.4" r="8.0" fill="#60A5FA"/><text font-size="13" fill="#E2E8F0" data-bg="#1B222C"><tspan x="57.0" y="195.0" data-nl="" font-size="13" font-weight="700" fill="#0D1117" data-bg="#60A5FA">V</tspan><tspan x="72.0" y="195.0"> disables the person's SSO user if they should lose vCenter as well.</tspan></text><rect x="52.0" y="207.0" width="566.0" height="251.0" rx="10" fill="#132338" stroke="#60A5FA" stroke-width="1.3"/><text font-size="14" fill="#E2E8F0" data-bg="#132338" font-weight="700"><tspan x="64.0" y="229.0" data-nl="">vSphere Namespace</tspan></text><circle cx="74.0" cy="243.4" r="8.0" fill="#60A5FA"/><text font-size="13" fill="#E2E8F0" data-bg="#132338"><tspan x="69.0" y="248.0" data-nl="" font-size="13" font-weight="700" fill="#0D1117" data-bg="#60A5FA">V</tspan><tspan x="84.0" y="248.0"> gives the SSO user Can view: it lets them log in, but gives no rights inside the</tspan><tspan x="64.0" y="265.0" data-nl="">VKS cluster. Not Can edit or Owner: those make them an administrator of every</tspan><tspan x="64.0" y="282.0" data-nl="">VKS cluster in the namespace.</tspan></text><rect x="64.0" y="294.0" width="542.0" height="152.0" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1.3"/><text font-size="14" fill="#E2E8F0" data-bg="#161B22" font-weight="700"><tspan x="76.0" y="316.0" data-nl="">VKS cluster</tspan></text><text font-size="13" fill="#E2E8F0" data-bg="#161B22"><tspan x="76.0" y="335.0" data-nl="">Knows the person by their SSO user name: logins ignore letter case, the</tspan><tspan x="76.0" y="352.0" data-nl="">cluster does not.</tspan></text><rect x="76.0" y="364.0" width="518.0" height="70.0" rx="10" fill="#0D2724" stroke="#2DD4BF" stroke-width="1.3"/><text font-size="14" fill="#E2E8F0" data-bg="#0D2724" font-weight="700"><tspan x="88.0" y="386.0" data-nl="">VKS_CLUSTER_NAMESPACE</tspan></text><circle cx="98.0" cy="400.4" r="8.0" fill="#CBD5E1"/><text font-size="13" fill="#E2E8F0" data-bg="#0D2724"><tspan x="93.0" y="405.0" data-nl="" font-size="13" font-weight="700" fill="#0D1117" data-bg="#CBD5E1">C</tspan><tspan x="108.0" y="405.0"> makes a RoleBinding that gives the name edit: create, change and</tspan><tspan x="88.0" y="422.0" data-nl="">delete most things in it. A folder for the team's workloads.</tspan></text>
<text font-size="14" fill="#E2E8F0" data-bg="#0D1117" font-weight="700"><tspan x="40.0" y="498.0" data-nl="">What VKS_CLUSTER_NAMESPACE may be</tspan></text>
<rect x="40" y="508.0" width="590" height="36" rx="9" fill="#132338" stroke="#60A5FA" stroke-width="1.1"/>
<circle cx="62" cy="526.0" r="13" fill="#60A5FA"/>
<g data-role="icon" data-fg="#0D1117" data-bg="#60A5FA" transform="translate(62.0,526.0) scale(0.846)" fill="none" stroke="#0D1117" stroke-width="2.36" stroke-linecap="round" stroke-linejoin="round"><path d="M-9,-6 H-3 L-1,-4 H9 V7 H-9 Z"/><path d="M-9,-1 H9"/></g>
<text font-size="13" fill="#E2E8F0" data-bg="#132338"><tspan x="86.0" y="530.5" data-nl="">One namespace: the only choice here</tspan></text>
<rect x="40" y="550.0" width="590" height="82" rx="9" fill="#2D1416" stroke="#F87171" stroke-width="1.1"/>
<circle cx="62" cy="591.0" r="13" fill="#F87171"/>
<g data-role="icon" data-fg="#0D1117" data-bg="#F87171" transform="translate(62.0,591.0) scale(0.846)" fill="none" stroke="#0D1117" stroke-width="2.36" stroke-linecap="round" stroke-linejoin="round"><path d="M-4,-9.5 H4 L9.5,-4 V4 L4,9.5 H-4 L-9.5,4 V-4 Z"/><path d="M-5,0 H5"/></g>
<text font-size="13" fill="#E2E8F0" data-bg="#2D1416"><tspan x="86.0" y="570.0" data-nl="">Empty or "*": the block stops; nothing is changed. With their SSO account, a</tspan><tspan x="86.0" y="587.0" data-nl="">person gets the whole cluster only from Can edit, which makes them</tspan><tspan x="86.0" y="604.0" data-nl="">administrator of every VKS cluster in the vSphere Namespace; step 1 does not</tspan><tspan x="86.0" y="621.0" data-nl="">give it.</tspan></text>
<text font-size="16" fill="#E2E8F0" data-bg="#0D1117" font-weight="700"><tspan x="650.0" y="142.0" data-nl="">The steps</tspan></text>
<rect x="650" y="154.0" width="510" height="121" rx="9" fill="#132338"/>
<rect x="650" y="159.0" width="5" height="111" rx="2.5" fill="#60A5FA"/>
<circle cx="675" cy="176.0" r="12" fill="#60A5FA"/>
<text font-size="14" fill="#0D1117" data-bg="#60A5FA" font-weight="700"><tspan x="670.1" y="181.0" data-nl="">1</tspan></text>
<text font-size="14" fill="#E2E8F0" data-bg="#132338" font-weight="700"><tspan x="694.0" y="178.0" data-nl="">Give the person a role on the vSphere Namespace</tspan></text>
<circle cx="704.0" cy="190.4" r="8.0" fill="#60A5FA"/><text font-size="13" fill="#E2E8F0" data-bg="#132338"><tspan x="699.0" y="195.0" data-nl="" font-size="13" font-weight="700" fill="#0D1117" data-bg="#60A5FA">V</tspan><tspan x="714.0" y="195.0"> gives Can view, then sends the names</tspan></text>
<text font-size="13" fill="#E2E8F0" data-bg="#132338"><tspan x="694.0" y="212.0" data-nl="">To the person: the Supervisor's address, the vSphere Namespace's</tspan><tspan x="694.0" y="229.0" data-nl="">and the cluster's names, and the vCenter CA. To the cluster</tspan><tspan x="694.0" y="246.0" data-nl="">administrator: the person's SSO user name exactly as vCenter lists</tspan><tspan x="694.0" y="263.0" data-nl="">it, letter case included.</tspan></text>
<rect x="650" y="281.0" width="510" height="104" rx="9" fill="#1B222C"/>
<rect x="650" y="286.0" width="5" height="94" rx="2.5" fill="#94A3B8"/>
<circle cx="675" cy="303.0" r="12" fill="#94A3B8"/>
<text font-size="14" fill="#0D1117" data-bg="#94A3B8" font-weight="700"><tspan x="670.1" y="308.0" data-nl="">2</tspan></text>
<text font-size="14" fill="#E2E8F0" data-bg="#1B222C" font-weight="700"><tspan x="694.0" y="305.0" data-nl="">Give the person rights inside the cluster</tspan></text>
<circle cx="704.0" cy="317.4" r="8.0" fill="#CBD5E1"/><text font-size="13" fill="#E2E8F0" data-bg="#1B222C"><tspan x="699.0" y="322.0" data-nl="" font-size="13" font-weight="700" fill="#0D1117" data-bg="#CBD5E1">C</tspan><tspan x="714.0" y="322.0"> sets SSO_USER and VKS_CLUSTER_NAMESPACE, before the</tspan><tspan x="694.0" y="339.0" data-nl="">person logs in</tspan></text>
<text font-size="13" fill="#E2E8F0" data-bg="#1B222C"><tspan x="694.0" y="356.0" data-nl="">Once per person. A name in other letter case gets no rights. Then</tspan><tspan x="694.0" y="373.0" data-nl="">send the person the namespace's name.</tspan></text>
<rect x="650" y="391.0" width="510" height="104" rx="9" fill="#11251A"/>
<rect x="650" y="396.0" width="5" height="94" rx="2.5" fill="#4ADE80"/>
<circle cx="675" cy="413.0" r="12" fill="#4ADE80"/>
<text font-size="14" fill="#0D1117" data-bg="#4ADE80" font-weight="700"><tspan x="670.1" y="418.0" data-nl="">3</tspan></text>
<text font-size="14" fill="#E2E8F0" data-bg="#11251A" font-weight="700"><tspan x="694.0" y="415.0" data-nl="">Log in with the VCF CLI</tspan></text>
<text font-size="13" fill="#E2E8F0" data-bg="#11251A"><tspan x="694.0" y="432.0" data-nl="">The person, with the user login guide</tspan></text>
<text font-size="13" fill="#E2E8F0" data-bg="#11251A"><tspan x="694.0" y="449.0" data-nl="">The login writes their own kubeconfig and lasts hours; then they log</tspan><tspan x="694.0" y="466.0" data-nl="">in again. Their rights stay. Without the VCF CLI: the kubectl vSphere</tspan><tspan x="694.0" y="483.0" data-nl="">plugin (optional and deprecated).</tspan></text>
<rect x="650" y="501.0" width="510" height="87" rx="9" fill="#11251A"/>
<rect x="650" y="506.0" width="5" height="77" rx="2.5" fill="#4ADE80"/>
<circle cx="675" cy="523.0" r="12" fill="#4ADE80"/>
<text font-size="14" fill="#0D1117" data-bg="#4ADE80" font-weight="700"><tspan x="670.1" y="528.0" data-nl="">4</tspan></text>
<text font-size="14" fill="#E2E8F0" data-bg="#11251A" font-weight="700"><tspan x="694.0" y="525.0" data-nl="">Use the login</tspan></text>
<text font-size="13" fill="#E2E8F0" data-bg="#11251A"><tspan x="694.0" y="542.0" data-nl="">The person</tspan></text>
<text font-size="13" fill="#E2E8F0" data-bg="#11251A"><tspan x="694.0" y="559.0" data-nl="">Their check shows who they are and whether they may deploy in the</tspan><tspan x="694.0" y="576.0" data-nl="">namespace they were given.</tspan></text>
<rect x="650" y="594.0" width="510" height="53" rx="9" fill="#2D1416"/>
<rect x="650" y="599.0" width="5" height="43" rx="2.5" fill="#F87171"/>
<circle cx="675" cy="616.0" r="12" fill="#F87171"/>
<text font-size="14" fill="#0D1117" data-bg="#F87171" font-weight="700"><tspan x="670.1" y="621.0" data-nl="">5</tspan></text>
<text font-size="14" fill="#E2E8F0" data-bg="#2D1416" font-weight="700"><tspan x="694.0" y="618.0" data-nl="">Take it away</tspan></text>
<circle cx="704.0" cy="630.5" r="8.0" fill="#CBD5E1"/><circle cx="766.0" cy="630.5" r="8.0" fill="#60A5FA"/><text font-size="13" fill="#E2E8F0" data-bg="#2D1416"><tspan x="699.0" y="635.0" data-nl="" font-size="13" font-weight="700" fill="#0D1117" data-bg="#CBD5E1">C</tspan><tspan x="714.0" y="635.0">, then </tspan><tspan x="760.9" y="635.0" font-size="13" font-weight="700" fill="#0D1117" data-bg="#60A5FA">V</tspan></text>
<text font-size="16" fill="#E2E8F0" data-bg="#0D1117" font-weight="700"><tspan x="40.0" y="677.0" data-nl="">Step 5 in full: who removes what, and the check afterwards</tspan></text>
<rect x="40.0" y="689" width="365.3" height="168.0" rx="10" fill="#2D1416" stroke="#F87171" stroke-width="1.2"/>
<text font-size="14" fill="#E2E8F0" data-bg="#2D1416" font-weight="700"><tspan x="84.0" y="714.0" data-nl="">Cluster administrator</tspan></text>
<circle cx="62.0" cy="709" r="13" fill="#F87171"/>
<g data-role="icon" data-fg="#0D1117" data-bg="#F87171" transform="translate(62.0,709.0) scale(0.846)" fill="none" stroke="#0D1117" stroke-width="2.36" stroke-linecap="round" stroke-linejoin="round"><circle cx="-5" cy="6" r="3"/><circle cx="5" cy="6" r="3"/><path d="M-3,3.5 L6,-9 M3,3.5 L-6,-9"/></g>
<circle cx="57.0" cy="736.5" r="2.6" fill="#F87171"/>
<text font-size="13" fill="#E2E8F0" data-bg="#2D1416"><tspan x="66.0" y="741.0" data-nl="">Deletes the RoleBinding from step 2: it stops at</tspan><tspan x="66.0" y="758.0" data-nl="">once</tspan></text>
<circle cx="57.0" cy="776.5" r="2.6" fill="#F87171"/>
<text font-size="13" fill="#E2E8F0" data-bg="#2D1416"><tspan x="66.0" y="781.0" data-nl="">With edit: tokens the person made for any</tspan><tspan x="66.0" y="798.0" data-nl="">ServiceAccount in the namespace, and workloads</tspan><tspan x="66.0" y="815.0" data-nl="">they started, keep working: delete them</tspan></text>
<rect x="417.3" y="689" width="365.3" height="168.0" rx="10" fill="#132338" stroke="#60A5FA" stroke-width="1.2"/>
<text font-size="14" fill="#E2E8F0" data-bg="#132338" font-weight="700"><tspan x="461.3" y="714.0" data-nl="">vCenter administrator</tspan></text>
<circle cx="439.3" cy="709" r="13" fill="#60A5FA"/>
<g data-role="icon" data-fg="#0D1117" data-bg="#60A5FA" transform="translate(439.3,709.0) scale(0.846)" fill="none" stroke="#0D1117" stroke-width="2.36" stroke-linecap="round" stroke-linejoin="round"><circle cx="-3" cy="-4" r="4"/><path d="M-10,9 C-10,2 4,2 4,9"/><rect x="4" y="-9" width="7" height="5" rx="1"/><path d="M6,-6.5 H9"/></g>
<circle cx="434.3" cy="736.5" r="2.6" fill="#60A5FA"/>
<text font-size="13" fill="#E2E8F0" data-bg="#132338"><tspan x="443.3" y="741.0" data-nl="">Removes the person's role on the vSphere</tspan><tspan x="443.3" y="758.0" data-nl="">Namespace</tspan></text>
<circle cx="434.3" cy="776.5" r="2.6" fill="#60A5FA"/>
<text font-size="13" fill="#E2E8F0" data-bg="#132338"><tspan x="443.3" y="781.0" data-nl="">Disables the SSO user if they should lose vCenter</tspan><tspan x="443.3" y="798.0" data-nl="">as well</tspan></text>
<rect x="794.7" y="689" width="365.3" height="168.0" rx="10" fill="#2A1F0E" stroke="#F59E0B" stroke-width="1.2"/>
<text font-size="14" fill="#E2E8F0" data-bg="#2A1F0E" font-weight="700"><tspan x="838.7" y="714.0" data-nl="">The person's check still says yes?</tspan></text>
<circle cx="816.7" cy="709" r="13" fill="#F59E0B"/>
<g data-role="icon" data-fg="#0D1117" data-bg="#F59E0B" transform="translate(816.7,709.0) scale(0.846)" fill="none" stroke="#0D1117" stroke-width="2.36" stroke-linecap="round" stroke-linejoin="round"><path d="M-10,0 Q0,-9 10,0 Q0,9 -10,0 Z"/><circle cx="0" cy="0" r="3"/></g>
<circle cx="811.7" cy="736.5" r="2.6" fill="#F59E0B"/>
<text font-size="13" fill="#E2E8F0" data-bg="#2A1F0E"><tspan x="820.7" y="741.0" data-nl="">Then they also have rights through a group: a</tspan><tspan x="820.7" y="758.0" data-nl="">group with Can edit or Owner on the vSphere</tspan><tspan x="820.7" y="775.0" data-nl="">Namespace is an administrator of every VKS</tspan><tspan x="820.7" y="792.0" data-nl="">cluster in it</tspan></text>
<circle cx="811.7" cy="810.5" r="2.6" fill="#F59E0B"/>
<text font-size="13" fill="#E2E8F0" data-bg="#2A1F0E"><tspan x="820.7" y="815.0" data-nl="">Take the person out of that group, or take the</tspan><tspan x="820.7" y="832.0" data-nl="">group's role away in vCenter</tspan></text>
<path d="M40,879 H1160" stroke="#30363D" stroke-width="1"/>
<circle cx="50.0" cy="896.5" r="8.0" fill="#60A5FA"/><text font-size="13" fill="#E2E8F0" data-bg="#0D1117"><tspan x="45.0" y="901.0" data-nl="" font-size="13" font-weight="700" fill="#0D1117" data-bg="#60A5FA">V</tspan><tspan x="60.0" y="901.0"> = vCenter administrator: gives roles on the</tspan><tspan x="40.0" y="918.0" data-nl="">vSphere Namespace</tspan></text>
<circle cx="423.3" cy="896.5" r="8.0" fill="#CBD5E1"/><text font-size="13" fill="#E2E8F0" data-bg="#0D1117"><tspan x="418.4" y="901.0" data-nl="" font-size="13" font-weight="700" fill="#0D1117" data-bg="#CBD5E1">C</tspan><tspan x="433.3" y="901.0"> = cluster administrator: gives rights inside the</tspan><tspan x="413.3" y="918.0" data-nl="">cluster</tspan></text>
<text font-size="13" fill="#E2E8F0" data-bg="#0D1117"><tspan x="786.7" y="901.0" data-nl="">The person: logs in as themselves and is sent names,</tspan><tspan x="786.7" y="918.0" data-nl="">not a kubeconfig</tspan></text>
</svg>

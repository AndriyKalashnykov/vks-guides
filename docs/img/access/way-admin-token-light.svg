<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 852" width="1200" height="852" font-family="'Segoe UI', Arial, sans-serif" role="img" aria-labelledby="t d"><title id="t">An administrator ServiceAccount token: the cluster administrator makes a ServiceAccount in SA_NAMESPACE and a ClusterRoleBinding that gives it cluster-admin on the whole VKS cluster, so whoever has a copy of the file can do everything in it; send this, never the cluster's administrator kubeconfig, because this one can be taken away. Taking it away deletes the ClusterRoleBinding, the token Secret and the ServiceAccount, but other logins the holder made with it keep working, and after a leak only a new cluster is certain to be clean.</title><desc id="d">An administrator ServiceAccount token: the cluster administrator makes a ServiceAccount in SA_NAMESPACE and a ClusterRoleBinding that gives it cluster-admin on the whole VKS cluster, so whoever has a copy of the file can do everything in it; send this, never the cluster's administrator kubeconfig, because this one can be taken away. Taking it away deletes the ClusterRoleBinding, the token Secret and the ServiceAccount, but other logins the holder made with it keep working, and after a leak only a new cluster is certain to be clean.</desc><rect x="0" y="0" width="1200" height="852" fill="#F6F4EF"/><rect x="6" y="6" width="1188" height="840" rx="14" fill="none" stroke="#DCE2E9"/><circle cx="66" cy="58" r="26" fill="#B91C1C"/>
<g data-role="icon" data-fg="#FFFFFF" data-bg="#B91C1C" transform="translate(66.0,58.0) scale(1.692)" fill="none" stroke="#FFFFFF" stroke-width="1.30" stroke-linecap="round" stroke-linejoin="round"><path d="M-9,6 L-9,-5 L-4,0 L0,-7 L4,0 L9,-5 L9,6 Z"/></g>
<text font-size="26" fill="#0F172A" data-bg="#F6F4EF" font-weight="700"><tspan x="106.0" y="54.0" data-nl="">An administrator ServiceAccount token (whole cluster)</tspan></text>
<text font-size="15" fill="#475569" data-bg="#F6F4EF"><tspan x="106.0" y="80.0" data-nl="">When a tool, a pipeline or a person needs the whole cluster: send this, never the cluster's administrator kubeconfig, because this one can</tspan><tspan x="106.0" y="100.0" data-nl="">be taken away. Whoever has a copy can do everything in the cluster.</tspan></text>
<text font-size="16" fill="#0F172A" data-bg="#F6F4EF" font-weight="700"><tspan x="40.0" y="142.0" data-nl="">Where the access lives</tspan></text>
<rect x="40.0" y="154.0" width="590.0" height="234.0" rx="10" fill="#EDF0F4" stroke="#475569" stroke-width="1.3"/><text font-size="14" fill="#0F172A" data-bg="#EDF0F4" font-weight="700"><tspan x="52.0" y="176.0" data-nl="">vCenter and the vSphere Namespace</tspan></text><text font-size="13" fill="#0F172A" data-bg="#EDF0F4"><tspan x="52.0" y="195.0" data-nl="">No step for the vCenter administrator. vCenter does not see what the token does; the</tspan><tspan x="52.0" y="212.0" data-nl="">cluster's own audit log on its control-plane node does.</tspan></text><rect x="52.0" y="224.0" width="566.0" height="152.0" rx="10" fill="#FBE9E9" stroke="#B91C1C" stroke-width="1.3"/><text font-size="14" fill="#0F172A" data-bg="#FBE9E9" font-weight="700"><tspan x="64.0" y="246.0" data-nl="">VKS cluster: the whole cluster</tspan></text><circle cx="74.0" cy="260.4" r="8.0" fill="#334155"/><text font-size="13" fill="#0F172A" data-bg="#FBE9E9"><tspan x="69.0" y="265.0" data-nl="" font-size="13" font-weight="700" fill="#FFFFFF" data-bg="#334155">C</tspan><tspan x="84.0" y="265.0"> makes a ClusterRoleBinding that gives the ServiceAccount cluster-admin, the</tspan><tspan x="64.0" y="282.0" data-nl="">role for everything, in every namespace.</tspan></text><rect x="64.0" y="294.0" width="542.0" height="70.0" rx="10" fill="#FBF0E4" stroke="#B45309" stroke-width="1.3"/><text font-size="14" fill="#0F172A" data-bg="#FBF0E4" font-weight="700"><tspan x="76.0" y="316.0" data-nl="">SA_NAMESPACE</tspan></text><text font-size="13" fill="#0F172A" data-bg="#FBF0E4"><tspan x="76.0" y="335.0" data-nl="">The ServiceAccount SERVICE_ACCOUNT_NAME, a login that belongs to no</tspan><tspan x="76.0" y="352.0" data-nl="">person; with DAYS never, also its token Secret that does not expire.</tspan></text>
<text font-size="16" fill="#0F172A" data-bg="#F6F4EF" font-weight="700"><tspan x="650.0" y="142.0" data-nl="">The steps</tspan></text>
<rect x="650" y="154.0" width="510" height="104" rx="9" fill="#EDF0F4"/>
<rect x="650" y="159.0" width="5" height="94" rx="2.5" fill="#475569"/>
<circle cx="675" cy="176.0" r="12" fill="#475569"/>
<text font-size="14" fill="#FFFFFF" data-bg="#475569" font-weight="700"><tspan x="670.1" y="181.0" data-nl="">1</tspan></text>
<text font-size="14" fill="#0F172A" data-bg="#EDF0F4" font-weight="700"><tspan x="694.0" y="178.0" data-nl="">Make the administrator token and its file</tspan></text>
<circle cx="704.0" cy="190.4" r="8.0" fill="#334155"/><text font-size="13" fill="#0F172A" data-bg="#EDF0F4"><tspan x="699.0" y="195.0" data-nl="" font-size="13" font-weight="700" fill="#FFFFFF" data-bg="#334155">C</tspan><tspan x="714.0" y="195.0"> sets SERVICE_ACCOUNT_NAME, SA_NAMESPACE and DAYS</tspan></text>
<text font-size="13" fill="#0F172A" data-bg="#EDF0F4"><tspan x="694.0" y="212.0" data-nl="">DAYS is a number of days, or never: until you take it away; the</tspan><tspan x="694.0" y="229.0" data-nl="">cluster does not shorten either. One file,</tspan><tspan x="694.0" y="246.0" data-nl="">SERVICE_ACCOUNT_KUBECONFIG, readable only by you.</tspan></text>
<rect x="650" y="264.0" width="510" height="104" rx="9" fill="#E7F4EB"/>
<rect x="650" y="269.0" width="5" height="94" rx="2.5" fill="#166534"/>
<circle cx="675" cy="286.0" r="12" fill="#166534"/>
<text font-size="14" fill="#FFFFFF" data-bg="#166534" font-weight="700"><tspan x="670.1" y="291.0" data-nl="">2</tspan></text>
<text font-size="14" fill="#0F172A" data-bg="#E7F4EB" font-weight="700"><tspan x="694.0" y="288.0" data-nl="">Hand it over and use it on another machine</tspan></text>
<circle cx="704.0" cy="300.4" r="8.0" fill="#334155"/><text font-size="13" fill="#0F172A" data-bg="#E7F4EB"><tspan x="699.0" y="305.0" data-nl="" font-size="13" font-weight="700" fill="#FFFFFF" data-bg="#334155">C</tspan><tspan x="714.0" y="305.0"> sends it as a secret, then the tool or person</tspan></text>
<text font-size="13" fill="#0F172A" data-bg="#E7F4EB"><tspan x="694.0" y="322.0" data-nl="">Needs only kubectl. A check run once on the receiving machine</tspan><tspan x="694.0" y="339.0" data-nl="">creates, changes and deletes a test namespace</tspan><tspan x="694.0" y="356.0" data-nl="">CHECK_NAMESPACE.</tspan></text>
<rect x="650" y="374.0" width="510" height="87" rx="9" fill="#EDF0F4"/>
<rect x="650" y="379.0" width="5" height="77" rx="2.5" fill="#475569"/>
<circle cx="675" cy="396.0" r="12" fill="#475569"/>
<text font-size="14" fill="#FFFFFF" data-bg="#475569" font-weight="700"><tspan x="670.1" y="401.0" data-nl="">3</tspan></text>
<text font-size="14" fill="#0F172A" data-bg="#EDF0F4" font-weight="700"><tspan x="694.0" y="398.0" data-nl="">Renew the administrator token</tspan></text>
<circle cx="704.0" cy="410.4" r="8.0" fill="#334155"/><text font-size="13" fill="#0F172A" data-bg="#EDF0F4"><tspan x="699.0" y="415.0" data-nl="" font-size="13" font-weight="700" fill="#FFFFFF" data-bg="#334155">C</tspan><tspan x="714.0" y="415.0">, for a token with days: step 1 again, send the new file</tspan></text>
<text font-size="13" fill="#0F172A" data-bg="#EDF0F4"><tspan x="694.0" y="432.0" data-nl="">A never token needs no renewal. Every older token keeps working</tspan><tspan x="694.0" y="449.0" data-nl="">until its own end, a never one until step 4.</tspan></text>
<rect x="650" y="467.0" width="510" height="87" rx="9" fill="#FBE9E9"/>
<rect x="650" y="472.0" width="5" height="77" rx="2.5" fill="#B91C1C"/>
<circle cx="675" cy="489.0" r="12" fill="#B91C1C"/>
<text font-size="14" fill="#FFFFFF" data-bg="#B91C1C" font-weight="700"><tspan x="670.1" y="494.0" data-nl="">4</tspan></text>
<text font-size="14" fill="#0F172A" data-bg="#FBE9E9" font-weight="700"><tspan x="694.0" y="491.0" data-nl="">Take the administrator token away</tspan></text>
<circle cx="704.0" cy="503.4" r="8.0" fill="#334155"/><text font-size="13" fill="#0F172A" data-bg="#FBE9E9"><tspan x="699.0" y="508.0" data-nl="" font-size="13" font-weight="700" fill="#FFFFFF" data-bg="#334155">C</tspan><tspan x="714.0" y="508.0">, when they should lose the cluster or a copy may have leaked</tspan></text>
<text font-size="13" fill="#0F172A" data-bg="#FBE9E9"><tspan x="694.0" y="525.0" data-nl="">Sets the same SERVICE_ACCOUNT_NAME and SA_NAMESPACE as</tspan><tspan x="694.0" y="542.0" data-nl="">step 1.</tspan></text>
<text font-size="16" fill="#0F172A" data-bg="#F6F4EF" font-weight="700"><tspan x="40.0" y="584.0" data-nl="">Step 4 in full: what it deletes, what it checks, what keeps working</tspan></text>
<rect x="40.0" y="596" width="365.3" height="168.0" rx="10" fill="#FBE9E9" stroke="#B91C1C" stroke-width="1.2"/>
<text font-size="14" fill="#0F172A" data-bg="#FBE9E9" font-weight="700"><tspan x="84.0" y="621.0" data-nl="">It deletes</tspan></text>
<circle cx="62.0" cy="616" r="13" fill="#B91C1C"/>
<g data-role="icon" data-fg="#FFFFFF" data-bg="#B91C1C" transform="translate(62.0,616.0) scale(0.846)" fill="none" stroke="#FFFFFF" stroke-width="2.36" stroke-linecap="round" stroke-linejoin="round"><circle cx="-5" cy="6" r="3"/><circle cx="5" cy="6" r="3"/><path d="M-3,3.5 L6,-9 M3,3.5 L-6,-9"/></g>
<circle cx="57.0" cy="643.5" r="2.6" fill="#B91C1C"/>
<text font-size="13" fill="#0F172A" data-bg="#FBE9E9"><tspan x="66.0" y="648.0" data-nl="">The ClusterRoleBinding: the file loses its rights at</tspan><tspan x="66.0" y="665.0" data-nl="">once</tspan></text>
<circle cx="57.0" cy="683.5" r="2.6" fill="#B91C1C"/>
<text font-size="13" fill="#0F172A" data-bg="#FBE9E9"><tspan x="66.0" y="688.0" data-nl="">The token Secret and the ServiceAccount</tspan></text>
<circle cx="57.0" cy="706.5" r="2.6" fill="#B91C1C"/>
<text font-size="13" fill="#0F172A" data-bg="#FBE9E9"><tspan x="66.0" y="711.0" data-nl="">Run again, it deletes only what is left</tspan></text>
<rect x="417.3" y="596" width="365.3" height="168.0" rx="10" fill="#EAF1FD" stroke="#2563EB" stroke-width="1.2"/>
<text font-size="14" fill="#0F172A" data-bg="#EAF1FD" font-weight="700"><tspan x="461.3" y="621.0" data-nl="">It checks</tspan></text>
<circle cx="439.3" cy="616" r="13" fill="#2563EB"/>
<g data-role="icon" data-fg="#FFFFFF" data-bg="#2563EB" transform="translate(439.3,616.0) scale(0.846)" fill="none" stroke="#FFFFFF" stroke-width="2.36" stroke-linecap="round" stroke-linejoin="round"><path d="M-10,0 Q0,-9 10,0 Q0,9 -10,0 Z"/><circle cx="0" cy="0" r="3"/></g>
<circle cx="434.3" cy="643.5" r="2.6" fill="#2563EB"/>
<text font-size="13" fill="#0F172A" data-bg="#EAF1FD"><tspan x="443.3" y="648.0" data-nl="">It then tries your copy of the file: every copy</tspan><tspan x="443.3" y="665.0" data-nl="">answers Unauthorized</tspan></text>
<rect x="794.7" y="596" width="365.3" height="168.0" rx="10" fill="#FBF0E4" stroke="#B45309" stroke-width="1.2"/>
<text font-size="14" fill="#0F172A" data-bg="#FBF0E4" font-weight="700"><tspan x="838.7" y="621.0" data-nl="">What keeps working</tspan></text>
<circle cx="816.7" cy="616" r="13" fill="#B45309"/>
<g data-role="icon" data-fg="#FFFFFF" data-bg="#B45309" transform="translate(816.7,616.0) scale(0.846)" fill="none" stroke="#FFFFFF" stroke-width="2.36" stroke-linecap="round" stroke-linejoin="round"><circle cx="-6" cy="6" r="3"/><circle cx="3" cy="6" r="3"/><path d="M-4,3.5 L4,-9 M1,3.5 L-7,-9"/><circle cx="9" cy="-1" r="2" fill="#FFFFFF" stroke="none"/></g>
<circle cx="811.7" cy="643.5" r="2.6" fill="#B45309"/>
<text font-size="13" fill="#0F172A" data-bg="#FBF0E4"><tspan x="820.7" y="648.0" data-nl="">Taking it away stops this file only: other logins the</tspan><tspan x="820.7" y="665.0" data-nl="">holder made with it keep working (another</tspan><tspan x="820.7" y="682.0" data-nl="">ServiceAccount, or a certificate signed with the</tspan><tspan x="820.7" y="699.0" data-nl="">cluster's keys)</tspan></text>
<circle cx="811.7" cy="717.5" r="2.6" fill="#B45309"/>
<text font-size="13" fill="#0F172A" data-bg="#FBF0E4"><tspan x="820.7" y="722.0" data-nl="">After a file may have leaked, only a new cluster is</tspan><tspan x="820.7" y="739.0" data-nl="">certain to be clean</tspan></text>
<path d="M40,786 H1160" stroke="#DCE2E9" stroke-width="1"/>
<circle cx="50.0" cy="803.5" r="8.0" fill="#334155"/><text font-size="13" fill="#0F172A" data-bg="#F6F4EF"><tspan x="45.0" y="808.0" data-nl="" font-size="13" font-weight="700" fill="#FFFFFF" data-bg="#334155">C</tspan><tspan x="60.0" y="808.0"> = cluster administrator: holds the cluster's administrator kubeconfig and does</tspan><tspan x="40.0" y="825.0" data-nl="">every step here</tspan></text>
<text font-size="13" fill="#0F172A" data-bg="#F6F4EF"><tspan x="600.0" y="808.0" data-nl="">Tool or person: uses the file it was sent; whoever holds a copy is that login</tspan></text>
</svg>

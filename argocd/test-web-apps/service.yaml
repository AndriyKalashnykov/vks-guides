apiVersion: v1
kind: Service
metadata:
  name: test-web-apps
  namespace: test-web-apps
  labels:
    app.kubernetes.io/name: test-web-apps
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: test-web-apps
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP

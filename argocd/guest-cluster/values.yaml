# docs/ARGOCD.md sets name, kubernetesVersion, vmClass and storageClass in the Application.
# The cluster's namespace is the Application's destination namespace: your vSphere Namespace.
name: ""                 # the VKS cluster's name
kubernetesVersion: ""    # as the Supervisor stores it, e.g. v1.37.1+vmware.4 (no "-vkr.N" ending)
vmClass: ""              # a VM class bound to the vSphere Namespace
storageClass: ""         # a storage class the vSphere Namespace may use
clusterClass: builtin-generic-v3.8.0
clusterClassNamespace: vmware-system-vks-public
controlPlaneReplicas: 1
workerReplicas: 2
podsCidr: 172.20.0.0/16
servicesCidr: 172.21.0.0/16
serviceDomain: cluster.local   # VKS 3.8 add-ons need it set
